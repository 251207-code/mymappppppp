<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생활 편의 지도 서비스</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      min-width: 330px;
      background-color: white;
      border-right: 3px solid #eee;
      display: flex;
      flex-direction: column;
    }

    /* 상단 검색 영역 */
    .search-box {
      padding: 20px;
      border-bottom: 1px solid #eee;
      background: linear-gradient(
        135deg,
        #ffe066,
        #ffb3c1,
        #a0e7e5
      );
    }

    .search-box h2 {
      margin-bottom: 15px;
      color: #222;
      font-size: 24px;
    }

    .search-form {
      display: flex;
      gap: 10px;
    }

    .search-form input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
    }

    .search-form button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background-color: #7b2cbf;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .search-form button:hover {
      opacity: 0.9;
    }

    /* 현재 위치 버튼 */
    .location-button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #00b894;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .location-button:hover {
      opacity: 0.9;
    }

    /* 카테고리 설명 */
    .legend {
      padding: 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      line-height: 2;
    }

    .legend span {
      display: inline-block;
      margin-right: 10px;
      font-weight: bold;
    }

    /* 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background-color: #fafafa;
    }

    .place-item {
      padding: 15px;
      border-radius: 12px;
      background-color: white;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
      border-left: 8px solid #ccc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .place-item:hover {
      transform: translateY(-2px);
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .place-address {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .place-category {
      font-size: 13px;
      color: #888;
    }

    /* 지도 영역 */
    .map-area {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {

      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      .map-area {
        height: 55%;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 패널 -->
    <div class="sidebar">

      <!-- 검색 영역 -->
      <div class="search-box">

        <h2>생활 편의 지도</h2>

        <form class="search-form" id="searchForm">
          <input
            type="text"
            id="keyword"
            placeholder="검색어 입력"
          />
          <button type="submit">검색</button>
        </form>

        <button
          class="location-button"
          id="moveCurrentLocation"
        >
          현재 위치로 이동
        </button>

      </div>

      <!-- 카테고리 설명 -->
      <div class="legend">
        <span style="color:#e74c3c;">● 병원</span>
        <span style="color:#27ae60;">● 식당</span>
        <span style="color:#3498db;">● 화장실</span>
        <span style="color:#f39c12;">● 버스정류장</span>
      </div>

      <!-- 결과 리스트 -->
      <div class="result-list" id="resultList"></div>

    </div>

    <!-- 지도 영역 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4d710afb68a9b941a190fa9f567d3977&libraries=services&autoload=false">
  </script>

  <script>

    // 지도 객체
    let map;

    // 장소 검색 객체
    let places;

    // 검색 마커 배열
    let markers = [];

    // 현재 위치 마커
    let currentMarker;

    // 현재 위치 좌표
    let currentPosition;

    // 위치 추적 ID
    let watchId;

    // 카카오맵 로드 완료 후 실행
    kakao.maps.load(() => {

      navigator.geolocation.getCurrentPosition(

        // 현재 위치 성공
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          initializeMap(currentPosition);

          // 위치 추적 시작
          startLocationTracking();

          // 주변 시설 자동 검색
          searchNearbyPlaces();

        },

        // 위치 실패
        () => {

          const defaultPosition = new kakao.maps.LatLng(
            37.566826,
            126.9786567
          );

          initializeMap(defaultPosition);

          searchNearbyPlaces();

          alert("위치 정보를 사용할 수 없습니다.");

        }

      );

    });

    // 지도 초기화 함수
    function initializeMap(centerPosition) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: centerPosition,
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(
        mapContainer,
        mapOption
      );

      // 장소 검색 객체 생성
      places = new kakao.maps.services.Places();

      // 사람 모양 현재 위치 마커 이미지
      const markerImage = new kakao.maps.MarkerImage(
        "https://cdn-icons-png.flaticon.com/512/1077/1077114.png",
        new kakao.maps.Size(45, 45)
      );

      // 현재 위치 마커 생성
      currentMarker = new kakao.maps.Marker({
        map: map,
        position: centerPosition,
        image: markerImage
      });

      // 현재 위치 인포윈도우
      const infoWindow = new kakao.maps.InfoWindow({
        content: `
          <div style="
            padding:8px;
            font-size:13px;
          ">
            🧍 현재 위치
          </div>
        `
      });

      infoWindow.open(map, currentMarker);

      // 검색 이벤트 연결
      setupSearchEvent();

      // 현재 위치 버튼 이벤트 연결
      setupLocationButton();

    }

    // 위치 추적 함수
    function startLocationTracking() {

      watchId = navigator.geolocation.watchPosition(

        // 위치 업데이트
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치 마커 이동
          currentMarker.setPosition(currentPosition);

        },

        // 오류 발생
        (error) => {

          console.error(error);

        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 5000
        }

      );

    }

    // 현재 위치 이동 버튼
    function setupLocationButton() {

      const button = document.getElementById(
        "moveCurrentLocation"
      );

      button.addEventListener("click", () => {

        if (currentPosition) {

          map.setCenter(currentPosition);

          map.setLevel(5);

        }

      });

    }

    // 주변 시설 검색 함수
    function searchNearbyPlaces() {

      // 병원
      searchCategory(
        "병원",
        "#e74c3c"
      );

      // 식당
      searchCategory(
        "맛집",
        "#27ae60"
      );

      // 화장실
      searchCategory(
        "화장실",
        "#3498db"
      );

      // 버스 정류장
      searchCategory(
        "버스정류장",
        "#f39c12"
      );

    }

    // 카테고리 검색 함수
    function searchCategory(
      keyword,
      color
    ) {

      places.keywordSearch(

        keyword,

        (data, status) => {

          if (
            status ===
            kakao.maps.services.Status.OK
          ) {

            displayPlaces(
              data,
              color,
              keyword
            );

          }

        },

        {
          location: currentPosition,
          radius: 3000
        }

      );

    }

    // 검색 이벤트 연결 함수
    function setupSearchEvent() {

      const searchForm =
        document.getElementById(
          "searchForm"
        );

      searchForm.addEventListener(

        "submit",

        (event) => {

          event.preventDefault();

          const keyword =
            document
              .getElementById(
                "keyword"
              )
              .value
              .trim();

          if (!keyword) {

            alert(
              "검색어를 입력해주세요."
            );

            return;

          }

          // 사용자 검색 실행
          searchUserKeyword(
            keyword
          );

        }

      );

    }

    // 사용자 검색 함수
    function searchUserKeyword(
      keyword
    ) {

      places.keywordSearch(

        keyword,

        (data, status) => {

          if (
            status ===
            kakao.maps.services.Status.OK
          ) {

            displayPlaces(
              data,
              "#8e44ad",
              keyword
            );

          } else {

            alert(
              "검색 결과가 없습니다."
            );

          }

        }

      );

    }

    // 장소 표시 함수
    function displayPlaces(
      placeData,
      color,
      category
    ) {

      const resultList =
        document.getElementById(
          "resultList"
        );

      placeData.forEach((place) => {

        const position =
          new kakao.maps.LatLng(
            place.y,
            place.x
          );

        // 원형 마커 생성
        const marker = new kakao.maps.Marker({

          map: map,

          position: position

        });

        markers.push(marker);

        // 커스텀 오버레이 생성
        const overlay =
          new kakao.maps.CustomOverlay({

            position: position,

            content: `
              <div style="
                width:18px;
                height:18px;
                border-radius:50%;
                background:${color};
                border:3px solid white;
                box-shadow:0 0 6px rgba(0,0,0,0.4);
              "></div>
            `

          });

        overlay.setMap(map);

        // 인포윈도우
        const infoWindow =
          new kakao.maps.InfoWindow({

            content: `
              <div style="
                padding:10px;
                font-size:13px;
              ">
                <b>${place.place_name}</b><br>
                ${category}
              </div>
            `

          });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(

          marker,

          "click",

          () => {

            infoWindow.open(
              map,
              marker
            );

          }

        );

        // 리스트 아이템 생성
        const item =
          document.createElement(
            "div"
          );

        item.className =
          "place-item";

        item.style.borderLeftColor =
          color;

        item.innerHTML = `
          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            ${
              place.road_address_name ||
              place.address_name
            }
          </div>

          <div class="place-category">
            ${category}
          </div>
        `;

        // 클릭 시 지도 이동
        item.addEventListener(

          "click",

          () => {

            map.setCenter(
              position
            );

            map.setLevel(3);

            infoWindow.open(
              map,
              marker
            );

          }

        );

        resultList.appendChild(item);

      });

    }

  </script>

</body>
</html>
