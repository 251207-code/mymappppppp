<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>어디든 가자</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", sans-serif;
      background: #f5fff4;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 36%;
      min-width: 360px;
      background: linear-gradient(
        to bottom,
        #f4ffe8,
        #fffde9,
        #eefaff
      );
      border-right: 2px solid #d9f2d0;
      display: flex;
      flex-direction: column;
    }

    /* 상단 타이틀 */
    .header {
      padding: 22px;
      border-bottom: 1px solid #dfead8;
    }

    .header h1 {
      font-size: 28px;
      color: #3f6f42;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #67806a;
      line-height: 1.5;
    }

    /* 검색 영역 */
    .search-box {
      padding: 18px;
      border-bottom: 1px solid #dfead8;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .search-form input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #cde7c8;
      background: white;
      font-size: 14px;
      outline: none;
    }

    .search-form button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #d5f5a6;
      color: #355b2f;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-form button:hover {
      opacity: 0.9;
    }

    /* 길찾기 영역 */
    .route-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .route-box input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cfe6cf;
      font-size: 14px;
    }

    .route-box button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fff0a6;
      cursor: pointer;
      font-weight: bold;
      color: #665300;
    }

    .route-result {
      margin-top: 12px;
      background: rgba(255,255,255,0.8);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      color: #46624a;
      line-height: 1.5;
    }

    /* 탭 */
    .tabs {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-bottom: 1px solid #dfead8;
      flex-wrap: wrap;
    }

    .tab-button {
      flex: 1;
      min-width: 70px;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #567259;
      transition: 0.2s;
    }

    .tab-button.active {
      background: #c8f5bf;
      color: #2f5e32;
    }

    /* 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .place-item {
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #e3efe1;
    }

    .place-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .place-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #355738;
    }

    .place-address,
    .place-phone {
      font-size: 14px;
      margin-bottom: 6px;
      color: #66756a;
    }

    .place-description {
      margin-top: 10px;
      background: #f8fff4;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #527057;
    }

    /* 지도 영역 */
    .map-area {
      flex: 1;
      position: relative;
      background: #dff7df;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 커스텀 오버레이 */
    .custom-overlay {
      background: white;
      border-radius: 16px;
      padding: 14px;
      width: 250px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      border: 2px solid #d8f1ce;
    }

    .overlay-title {
      font-size: 17px;
      font-weight: bold;
      color: #406b41;
      margin-bottom: 8px;
    }

    .overlay-text {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .overlay-link {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #0b7dda;
      font-size: 13px;
      font-weight: bold;
    }

    /* 모바일 */
    @media (max-width: 768px) {

      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50%;
      }

      .map-area {
        height: 50%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 패널 -->
    <div class="sidebar">

      <!-- 헤더 -->
      <div class="header">
        <h1>🌿 어디든 가자</h1>
        <p>
          자연과 문화 속에서 나만의 휴식을 찾아보세요.
        </p>
      </div>

      <!-- 검색 -->
      <div class="search-box">

        <form class="search-form" id="searchForm">

          <input
            type="text"
            id="keyword"
            placeholder="장소 / 동네 / 키워드 검색"
          />

          <button type="submit">
            검색
          </button>

        </form>

        <!-- 길찾기 -->
        <div class="route-box">

          <input
            type="text"
            id="startPlace"
            placeholder="출발지 입력"
          />

          <input
            type="text"
            id="endPlace"
            placeholder="도착지 입력"
          />

          <button id="routeButton">
            소요 시간 확인
          </button>

          <div class="route-result" id="routeResult">
            출발지와 도착지를 입력해 주세요.
          </div>

        </div>

      </div>

      <!-- 탭 -->
      <div class="tabs">

        <button class="tab-button active" data-category="CT1">
          문화
        </button>

        <button class="tab-button" data-category="FD6,CE7">
          음식·카페
        </button>

        <button class="tab-button" data-category="AD5">
          숙박
        </button>

        <button class="tab-button" data-category="AT4">
          관광명소
        </button>

      </div>

      <!-- 결과 -->
      <div class="result-list" id="resultList"></div>

    </div>

    <!-- 지도 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4d710afb68a9b941a190fa9f567d3977&libraries=services&autoload=false">
  </script>

  <script>

    // 지도 객체
    let map;

    // 장소 검색 객체
    let places;

    // 마커 배열
    let markers = [];

    // 현재 위치
    let currentPosition;

    // 현재 오버레이
    let currentOverlay = null;

    // 카카오맵 로드
    kakao.maps.load(() => {

      navigator.geolocation.getCurrentPosition(

        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          initializeMap(currentPosition);

        },

        () => {

          currentPosition = new kakao.maps.LatLng(
            37.566826,
            126.9786567
          );

          initializeMap(currentPosition);

        }

      );

    });

    // 지도 초기화
    function initializeMap(centerPosition) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: centerPosition,
        level: 5
      };

      map = new kakao.maps.Map(
        mapContainer,
        mapOption
      );

      // 자연 느낌 지도 오버레이
      map.setMapTypeId(kakao.maps.MapTypeId.NORMAL);

      // 현재 위치 마커 (나무)
      const treeMarker = new kakao.maps.Marker({

        map: map,
        position: centerPosition,

        image: new kakao.maps.MarkerImage(
          "https://cdn-icons-png.flaticon.com/512/427/427735.png",

          new kakao.maps.Size(42, 42)
        )

      });

      // 현재 위치 말풍선
      const currentInfo = new kakao.maps.InfoWindow({

        content: `
          <div style="
            padding:10px;
            font-size:13px;
          ">
            🌳 현재 위치
          </div>
        `

      });

      currentInfo.open(map, treeMarker);

      places = new kakao.maps.services.Places();

      setupSearchEvent();
      setupTabEvent();
      setupRouteEvent();

      // 기본 문화 검색
      searchByCategory("CT1");

    }

    // 검색 이벤트
    function setupSearchEvent() {

      const form = document.getElementById("searchForm");

      form.addEventListener("submit", (event) => {

        event.preventDefault();

        const keyword = document
          .getElementById("keyword")
          .value
          .trim();

        if (!keyword) {
          alert("검색어를 입력해주세요.");
          return;
        }

        searchKeyword(keyword);

      });

    }

    // 탭 이벤트
    function setupTabEvent() {

      const buttons = document.querySelectorAll(".tab-button");

      buttons.forEach((button) => {

        button.addEventListener("click", () => {

          buttons.forEach((btn) => {
            btn.classList.remove("active");
          });

          button.classList.add("active");

          const category = button.dataset.category;

          searchByCategory(category);

        });

      });

    }

    // 길찾기 이벤트
    function setupRouteEvent() {

      const routeButton = document.getElementById("routeButton");

      routeButton.addEventListener("click", () => {

        const start = document
          .getElementById("startPlace")
          .value;

        const end = document
          .getElementById("endPlace")
          .value;

        if (!start || !end) {

          alert("출발지와 도착지를 입력해주세요.");
          return;

        }

        // 간단한 거리 기반 예상 시간
        places.keywordSearch(start, (startData, startStatus) => {

          if (startStatus !== kakao.maps.services.Status.OK) {
            return;
          }

          places.keywordSearch(end, (endData, endStatus) => {

            if (endStatus !== kakao.maps.services.Status.OK) {
              return;
            }

            const startLat = parseFloat(startData[0].y);
            const startLng = parseFloat(startData[0].x);

            const endLat = parseFloat(endData[0].y);
            const endLng = parseFloat(endData[0].x);

            const distance = getDistance(
              startLat,
              startLng,
              endLat,
              endLng
            );

            const walkingTime = Math.round(distance / 4);
            const carTime = Math.round(distance / 35);

            document.getElementById("routeResult").innerHTML = `
              🌿 예상 거리: ${distance.toFixed(1)}km<br>
              🚶 도보 약 ${walkingTime}시간<br>
              🚗 차량 약 ${carTime}시간
            `;

          });

        });

      });

    }

    // 거리 계산
    function getDistance(lat1, lng1, lat2, lng2) {

      const radius = 6371;

      const dLat = deg2rad(lat2 - lat1);
      const dLng = deg2rad(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(deg2rad(lat1)) *
        Math.cos(deg2rad(lat2)) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

      const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

      return radius * c;

    }

    // 라디안 변환
    function deg2rad(degree) {
      return degree * (Math.PI / 180);
    }

    // 키워드 검색
    function searchKeyword(keyword) {

      places.keywordSearch(

        keyword,

        (data, status) => {

          if (
            status === kakao.maps.services.Status.OK
          ) {

            displayPlaces(data);

          } else {

            alert("검색 결과가 없습니다.");

          }

        }

      );

    }

    // 카테고리 검색
    function searchByCategory(categoryCode) {

      removeMarkers();

      const categoryList = categoryCode.split(",");

      const allResults = [];

      let completed = 0;

      categoryList.forEach((code) => {

        places.categorySearch(

          code,

          (data, status) => {

            completed++;

            if (
              status === kakao.maps.services.Status.OK
            ) {

              allResults.push(...data);

            }

            if (
              completed === categoryList.length
            ) {

              displayPlaces(allResults);

            }

          },

          {
            location: currentPosition,
            radius: 5000
          }

        );

      });

    }

    // 장소 표시
    function displayPlaces(placeData) {

      const resultList =
        document.getElementById("resultList");

      resultList.innerHTML = "";

      removeMarkers();

      const bounds =
        new kakao.maps.LatLngBounds();

      placeData.forEach((place) => {

        const position =
          new kakao.maps.LatLng(
            place.y,
            place.x
          );

        bounds.extend(position);

        // 카테고리별 색상
        let markerColor = "#87CEEB";

        if (
          place.category_group_code === "AT4"
        ) {
          markerColor = "#B7E778";
        }

        if (
          place.category_group_code === "CT1"
        ) {
          markerColor = "#FFD84D";
        }

        // SVG 마커
        const svgMarker = `
          <svg xmlns="http://www.w3.org/2000/svg"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="${markerColor}">
            <path d="M12 2C8.1 2 5 5.1 5 9
            c0 5.3 7 13 7 13s7-7.7 7-13
            c0-3.9-3.1-7-7-7z"/>
          </svg>
        `;

        const markerImage =
          new kakao.maps.MarkerImage(

            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(svgMarker),

            new kakao.maps.Size(40, 40)

          );

        const marker = new kakao.maps.Marker({

          map: map,
          position: position,
          image: markerImage

        });

        markers.push(marker);

        // 휴식 설명 생성
        const restDescription =
          getRelaxDescription(
            place.category_group_code
          );

        // 커스텀 오버레이
        const overlayContent = `
          <div class="custom-overlay">

            <div class="overlay-title">
              ${place.place_name}
            </div>

            <div class="overlay-text">
              📞 ${place.phone || "전화번호 없음"}
            </div>

            <div class="overlay-text">
              🌿 ${restDescription}
            </div>

            <a
              class="overlay-link"
              href="${place.place_url}"
              target="_blank"
            >
              카카오맵에서 보기
            </a>

          </div>
        `;

        const overlay =
          new kakao.maps.CustomOverlay({

            content: overlayContent,
            position: position,
            yAnchor: 1.2

          });

        // 마커 클릭
        kakao.maps.event.addListener(
          marker,
          "click",
          () => {

            if (currentOverlay) {
              currentOverlay.setMap(null);
            }

            overlay.setMap(map);

            currentOverlay = overlay;

          }
        );

        // 결과 카드
        const item =
          document.createElement("div");

        item.className = "place-item";

        item.innerHTML = `

          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            📍
            ${place.road_address_name ||
              place.address_name}
          </div>

          <div class="place-phone">
            📞
            ${place.phone || "전화번호 없음"}
          </div>

          <div class="place-description">
            🌿 ${restDescription}
          </div>

        `;

        item.addEventListener("click", () => {

          map.setCenter(position);
          map.setLevel(3);

          if (currentOverlay) {
            currentOverlay.setMap(null);
          }

          overlay.setMap(map);

          currentOverlay = overlay;

        });

        resultList.appendChild(item);

      });

      map.setBounds(bounds);

    }

    // 휴식 설명 함수
    function getRelaxDescription(categoryCode) {

      if (categoryCode === "AT4") {

        return `
          자연 풍경과 함께 여유롭게 산책하며
          마음을 편안하게 만들 수 있는 공간입니다.
        `;

      }

      if (categoryCode === "CT1") {

        return `
          전시·예술·문화 체험을 통해
          감성과 영감을 얻을 수 있는 공간입니다.
        `;

      }

      if (
        categoryCode === "FD6" ||
        categoryCode === "CE7"
      ) {

        return `
          맛있는 음식과 향긋한 커피를 즐기며
          편안한 휴식을 보낼 수 있는 공간입니다.
        `;

      }

      if (categoryCode === "AD5") {

        return `
          조용하고 아늑한 분위기에서
          몸과 마음을 편히 쉬어갈 수 있는 공간입니다.
        `;

      }

      return `
        일상 속에서 잠시 쉬어갈 수 있는
        편안한 장소입니다.
      `;

    }

    // 마커 제거
    function removeMarkers() {

      markers.forEach((marker) => {
        marker.setMap(null);
      });

      markers = [];

    }

  </script>

</body>
</html>
