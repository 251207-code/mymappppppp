<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      min-width: 320px;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    /* 검색 영역 */
    .search-box {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .search-box h2 {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .search-form {
      display: flex;
      gap: 10px;
    }

    .search-form input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .search-form button {
      padding: 12px 18px;
      border: none;
      background-color: #fee500;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-form button:hover {
      opacity: 0.9;
    }

    /* 검색 결과 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .place-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: 0.2s;
    }

    .place-item:hover {
      background-color: #f8f8f8;
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place-address {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .place-phone {
      font-size: 13px;
      color: #888;
    }

    /* 오른쪽 지도 */
    .map-area {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      .map-area {
        height: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 패널 -->
    <div class="sidebar">

      <!-- 검색 영역 -->
      <div class="search-box">
        <h2>장소 검색</h2>

        <form class="search-form" id="searchForm">
          <input
            type="text"
            id="keyword"
            placeholder="검색어를 입력하세요"
          />
          <button type="submit">검색</button>
        </form>
      </div>

      <!-- 검색 결과 리스트 -->
      <div class="result-list" id="resultList"></div>
    </div>

    <!-- 오른쪽 지도 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <!-- autoload=false 로 설정하여 지도 로딩 완료 후 실행 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4d710afb68a9b941a190fa9f567d3977&libraries=services&autoload=false">
  </script>

  <script>
    // 지도 객체
    let map;

    // 장소 검색 객체
    let places;

    // 마커 배열
    let markers = [];

    // 현재 위치 마커
    let currentMarker;

    // 카카오맵 로딩 완료 후 실행
    kakao.maps.load(() => {

      // 현재 위치 가져오기
      navigator.geolocation.getCurrentPosition(

        // 위치 권한 허용 성공
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const currentPosition = new kakao.maps.LatLng(latitude, longitude);

          initializeMap(currentPosition);

        },

        // 위치 권한 거부 또는 실패
        () => {

          // 기본 위치 (서울 시청)
          const defaultPosition = new kakao.maps.LatLng(
            37.566826,
            126.9786567
          );

          initializeMap(defaultPosition);

          alert("위치 정보를 가져올 수 없어 기본 위치로 표시합니다.");
        }

      );

    });

    // 지도 초기화 함수
    function initializeMap(centerPosition) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: centerPosition,
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 현재 위치 마커 생성
      currentMarker = new kakao.maps.Marker({
        map: map,
        position: centerPosition
      });

      // 장소 검색 서비스 생성
      places = new kakao.maps.services.Places();

      // 현재 위치 인포윈도우
      const infoWindow = new kakao.maps.InfoWindow({
        content: `
          <div style="
            padding:8px;
            font-size:13px;
          ">
            현재 위치
          </div>
        `
      });

      infoWindow.open(map, currentMarker);

      // 검색 이벤트 연결
      setupSearchEvent();
    }

    // 검색 이벤트 함수
    function setupSearchEvent() {

      const searchForm = document.getElementById("searchForm");

      searchForm.addEventListener("submit", (event) => {

        event.preventDefault();

        const keyword = document
          .getElementById("keyword")
          .value
          .trim();

        if (!keyword) {
          alert("검색어를 입력해주세요.");
          return;
        }

        searchPlaces(keyword);
      });
    }

    // 장소 검색 함수
    function searchPlaces(keyword) {

      places.keywordSearch(keyword, (data, status) => {

        if (status === kakao.maps.services.Status.OK) {

          displayPlaces(data);

        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {

          alert("검색 결과가 없습니다.");

        } else {

          alert("검색 중 오류가 발생했습니다.");
        }
      });
    }

    // 검색 결과 표시 함수
    function displayPlaces(placeData) {

      const resultList = document.getElementById("resultList");

      // 기존 결과 초기화
      resultList.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      // 지도 범위 재설정용 객체
      const bounds = new kakao.maps.LatLngBounds();

      placeData.forEach((place) => {

        const position = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        markers.push(marker);

        // 지도 범위에 추가
        bounds.extend(position);

        // 인포윈도우 생성
        const infoWindow = new kakao.maps.InfoWindow({
          content: `
            <div style="
              padding:8px;
              font-size:13px;
            ">
              ${place.place_name}
            </div>
          `
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(marker, "click", () => {

          infoWindow.open(map, marker);

        });

        // 결과 리스트 아이템 생성
        const item = document.createElement("div");
        item.className = "place-item";

        item.innerHTML = `
          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            ${place.road_address_name || place.address_name}
          </div>

          <div class="place-phone">
            ${place.phone || "전화번호 없음"}
          </div>
        `;

        // 리스트 클릭 시 지도 이동
        item.addEventListener("click", () => {

          map.setCenter(position);

          infoWindow.open(map, marker);

        });

        resultList.appendChild(item);

      });

      // 검색 결과가 모두 보이도록 지도 범위 조정
      map.setBounds(bounds);
    }

    // 마커 제거 함수
    function removeMarkers() {

      markers.forEach((marker) => {
        marker.setMap(null);
      });

      markers = [];
    }
  </script>

</body>
</html>
