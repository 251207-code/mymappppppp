<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>어디든 가자</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #edf7ed;
    }

    /* 전체 레이아웃 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 37%;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(
          to bottom,
          #f7fff7,
          #edf8ed
        );
      border-right: 2px solid #d8ead8;
      overflow: hidden;
    }

    /* 검색 영역 */
    .search-box {
      padding: 20px;
      border-bottom: 1px solid #dfeedd;
      background:
        linear-gradient(
          to bottom,
          #f8fff8,
          #eef9ef
        );
    }

    .search-box h2 {
      font-size: 30px;
      margin-bottom: 18px;
      color: #346041;
    }

    /* 검색 폼 */
    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-form input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #cfe3cf;
      font-size: 15px;
      background: white;
    }

    .search-form button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #79b77e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-form button:hover {
      opacity: 0.9;
    }

    /* 길찾기 */
    .route-box {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.8);
      border: 1px solid #d8ead8;
    }

    .route-title {
      font-size: 17px;
      margin-bottom: 10px;
      font-weight: bold;
      color: #346041;
    }

    .route-input {
      width: 100%;
      padding: 11px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #cfe3cf;
      font-size: 14px;
    }

    .route-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #4f9862;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .route-result {
      font-size: 14px;
      line-height: 1.7;
      color: #45644d;
      background: #f2faf2;
      padding: 12px;
      border-radius: 10px;
    }

    /* 탭 */
    .tab-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-button {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background: #dff0df;
      color: #356744;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-button.active {
      background: #79b77e;
      color: white;
    }

    /* 검색 결과 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .place-item {
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      border: 1px solid #deedde;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .place-item:hover {
      transform: translateY(-2px);
      background: #f7fff7;
    }

    .place-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #355c3b;
    }

    .place-address {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .place-phone {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    /* 휴식 설명 */
    .place-description {
      font-size: 13px;
      line-height: 1.6;
      color: #4d6b55;
      background: #f3fbf3;
      padding: 10px;
      border-radius: 10px;
    }

    /* 지도 영역 */
    .map-area {
      flex: 1;
      position: relative;
      background: #dff1df;
    }

    #map {
      width: 100%;
      height: 100%;
      filter:
        saturate(1.08)
        contrast(1.02)
        brightness(1.03);
    }

    /* 커스텀 말풍선 */
    .custom-overlay {
      width: 250px;
      padding: 16px;
      border-radius: 18px;
      background: white;
      border: 2px solid #dff0df;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .overlay-title {
      font-size: 16px;
      font-weight: bold;
      color: #355c3b;
      margin-bottom: 8px;
    }

    .overlay-phone {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .overlay-description {
      font-size: 13px;
      line-height: 1.6;
      color: #4f6a56;
      margin-bottom: 12px;
    }

    .overlay-link {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 10px;
      background: #79b77e;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    /* 모바일 */
    @media (max-width: 768px) {

      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50%;
      }

      .map-area {
        height: 50%;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- 왼쪽 패널 -->
    <div class="sidebar">

      <div class="search-box">

        <h2>🌿 어디든 가자</h2>

        <!-- 장소 검색 -->
        <form
          class="search-form"
          id="searchForm"
        >

          <input
            type="text"
            id="keyword"
            placeholder="검색어를 입력하세요"
          />

          <button type="submit">
            검색
          </button>

        </form>

        <!-- 길찾기 -->
        <div class="route-box">

          <div class="route-title">
            🚶 길찾기
          </div>

          <input
            type="text"
            id="startPlace"
            class="route-input"
            placeholder="출발지 입력"
          />

          <input
            type="text"
            id="endPlace"
            class="route-input"
            placeholder="도착지 입력"
          />

          <button
            class="route-button"
            id="routeButton"
          >
            소요 시간 확인
          </button>

          <div
            class="route-result"
            id="routeResult"
          ></div>

        </div>

        <!-- 탭 -->
        <div class="tab-container">

          <button
            class="tab-button active"
            data-category="CT1"
          >
            문화
          </button>

          <button
            class="tab-button"
            data-category="FOOD"
          >
            음식·카페
          </button>

          <button
            class="tab-button"
            data-category="AD5"
          >
            숙박
          </button>

          <button
            class="tab-button"
            data-category="AT4"
          >
            관광명소
          </button>

        </div>

      </div>

      <!-- 검색 결과 -->
      <div
        class="result-list"
        id="resultList"
      ></div>

    </div>

    <!-- 지도 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4d710afb68a9b941a190fa9f567d3977&libraries=services&autoload=false">
  </script>

  <script>

    // 지도 객체
    let map;

    // 장소 검색 객체
    let places;

    // 마커 배열
    let markers = [];

    // 오버레이 배열
    let overlays = [];

    // 현재 위치
    let currentPosition;

    // 현재 카테고리
    let currentCategory = "CT1";

    // 카카오맵 로딩
    kakao.maps.load(() => {

      navigator.geolocation.getCurrentPosition(

        // 위치 허용 성공
        (position) => {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          currentPosition =
            new kakao.maps.LatLng(
              latitude,
              longitude
            );

          initializeMap(currentPosition);

        },

        // 위치 실패
        () => {

          currentPosition =
            new kakao.maps.LatLng(
              37.566826,
              126.9786567
            );

          initializeMap(currentPosition);

          alert(
            "현재 위치를 불러오지 못했습니다."
          );

        }

      );

    });

    // 지도 초기화
    function initializeMap(centerPosition) {

      const mapContainer =
        document.getElementById("map");

      const mapOption = {
        center: centerPosition,
        level: 5
      };

      // 지도 생성
      map =
        new kakao.maps.Map(
          mapContainer,
          mapOption
        );

      // 장소 검색 객체 생성
      places =
        new kakao.maps.services.Places(map);

      // 현재 위치 표시
      displayCurrentLocation(centerPosition);

      // 이벤트 연결
      setupSearchEvent();
      setupTabEvent();
      setupRouteEvent();

      // 기본 카테고리 검색
      searchCategoryPlaces("CT1");

    }

    // 현재 위치 표시
    function displayCurrentLocation(position) {

      const treeOverlay =
        new kakao.maps.CustomOverlay({

          position: position,

          content: `
            <div style="
              font-size:40px;
              transform:translateY(-22px);
            ">
              🌳
            </div>
          `

        });

      treeOverlay.setMap(map);

    }

    // 검색 이벤트
    function setupSearchEvent() {

      const searchForm =
        document.getElementById("searchForm");

      searchForm.addEventListener(

        "submit",

        (event) => {

          event.preventDefault();

          const keyword =
            document
              .getElementById("keyword")
              .value
              .trim();

          if (!keyword) {

            alert("검색어를 입력해주세요.");
            return;

          }

          searchKeywordPlaces(keyword);

        }

      );

    }

    // 탭 이벤트
    function setupTabEvent() {

      const tabButtons =
        document.querySelectorAll(".tab-button");

      tabButtons.forEach((button) => {

        button.addEventListener("click", () => {

          tabButtons.forEach((tab) => {
            tab.classList.remove("active");
          });

          button.classList.add("active");

          currentCategory =
            button.dataset.category;

          searchCategoryPlaces(currentCategory);

        });

      });

    }

    // 길찾기 이벤트
    function setupRouteEvent() {

      const routeButton =
        document.getElementById("routeButton");

      routeButton.addEventListener("click", () => {

        const startPlace =
          document
            .getElementById("startPlace")
            .value
            .trim();

        const endPlace =
          document
            .getElementById("endPlace")
            .value
            .trim();

        if (!startPlace || !endPlace) {

          alert(
            "출발지와 도착지를 입력해주세요."
          );

          return;

        }

        calculateTravelTime(
          startPlace,
          endPlace
        );

      });

    }

    // 이동 시간 계산
    function calculateTravelTime(
      startPlace,
      endPlace
    ) {

      places.keywordSearch(

        startPlace,

        (startData, startStatus) => {

          if (
            startStatus !==
            kakao.maps.services.Status.OK
          ) {

            alert("출발지를 찾을 수 없습니다.");
            return;

          }

          places.keywordSearch(

            endPlace,

            (endData, endStatus) => {

              if (
                endStatus !==
                kakao.maps.services.Status.OK
              ) {

                alert("도착지를 찾을 수 없습니다.");
                return;

              }

              const startLat =
                parseFloat(startData[0].y);

              const startLng =
                parseFloat(startData[0].x);

              const endLat =
                parseFloat(endData[0].y);

              const endLng =
                parseFloat(endData[0].x);

              const distance =
                getDistance(
                  startLat,
                  startLng,
                  endLat,
                  endLng
                );

              const walkTime =
                Math.round(distance / 4);

              const carTime =
                Math.round(distance / 40 * 60);

              const routeResult =
                document.getElementById(
                  "routeResult"
                );

              routeResult.innerHTML = `
                📍 거리 : ${distance.toFixed(1)} km<br>
                🚶 도보 : 약 ${walkTime} 시간<br>
                🚗 자동차 : 약 ${carTime} 분
              `;

            }

          );

        }

      );

    }

    // 거리 계산 함수
    function getDistance(
      lat1,
      lng1,
      lat2,
      lng2
    ) {

      const earthRadius = 6371;

      const latitudeDiff =
        (lat2 - lat1) *
        Math.PI / 180;

      const longitudeDiff =
        (lng2 - lng1) *
        Math.PI / 180;

      const calculation =

        Math.sin(latitudeDiff / 2) *
        Math.sin(latitudeDiff / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(longitudeDiff / 2) *
        Math.sin(longitudeDiff / 2);

      const distance =

        2 *
        Math.atan2(
          Math.sqrt(calculation),
          Math.sqrt(1 - calculation)
        );

      return earthRadius * distance;

    }

    // 휴식 설명 생성
    function getRelaxDescription(place) {

      // 문화
      if (currentCategory === "CT1") {

        return "전시·공연·문화 공간을 통해 감성과 영감을 얻으며 조용한 문화적 휴식을 즐길 수 있는 장소예요.";

      }

      // 음식·카페
      if (currentCategory === "FOOD") {

        return "맛있는 음식과 향긋한 커피를 즐기며 여유로운 시간을 보내기 좋은 휴식 공간이에요.";

      }

      // 숙박
      if (currentCategory === "AD5") {

        return "편안한 숙박과 아늑한 분위기를 통해 몸과 마음의 피로를 풀 수 있는 공간이에요.";

      }

      // 관광명소
      if (currentCategory === "AT4") {

        return "아름다운 풍경과 특별한 분위기를 통해 여행의 즐거움과 힐링을 느낄 수 있는 장소예요.";

      }

      return "편안하게 쉬어갈 수 있는 장소예요.";

    }

    // 키워드 검색
    function searchKeywordPlaces(keyword) {

      removeMarkers();

      places.keywordSearch(

        keyword,

        (data, status) => {

          if (
            status ===
            kakao.maps.services.Status.OK
          ) {

            displayPlaces(data);

          } else {

            alert("검색 결과가 없습니다.");

          }

        }

      );

    }

    // 카테고리 검색
    function searchCategoryPlaces(categoryCode) {

      removeMarkers();

      // 음식 + 카페
      if (categoryCode === "FOOD") {

        searchMultipleCategories(
          ["FD6", "CE7"]
        );

        return;

      }

      places.categorySearch(

        categoryCode,

        (data, status) => {

          if (
            status ===
            kakao.maps.services.Status.OK
          ) {

            displayPlaces(data);

          } else {

            alert("검색 결과가 없습니다.");

          }

        },

        {
          location: currentPosition,
          radius: 5000
        }

      );

    }

    // 여러 카테고리 검색
    function searchMultipleCategories(
      categoryArray
    ) {

      let combinedData = [];

      let completedCount = 0;

      categoryArray.forEach((categoryCode) => {

        places.categorySearch(

          categoryCode,

          (data, status) => {

            completedCount++;

            if (
              status ===
              kakao.maps.services.Status.OK
            ) {

              combinedData =
                combinedData.concat(data);

            }

            if (
              completedCount ===
              categoryArray.length
            ) {

              displayPlaces(combinedData);

            }

          },

          {
            location: currentPosition,
            radius: 5000
          }

        );

      });

    }

    // 장소 표시
    function displayPlaces(placeData) {

      const resultList =
        document.getElementById("resultList");

      resultList.innerHTML = "";

      const bounds =
        new kakao.maps.LatLngBounds();

      placeData.forEach((place) => {

        const position =
          new kakao.maps.LatLng(
            place.y,
            place.x
          );

        // 휴식 설명
        const relaxDescription =
          getRelaxDescription(place);

        // 기본 마커 색상
        let markerColor = "#6EC6FF";

        // 문화
        if (currentCategory === "CT1") {

          markerColor = "#FFD93D";

        }

        // 관광명소
        else if (
          currentCategory === "AT4"
        ) {

          markerColor = "#A8E063";

        }

        // SVG 마커 생성
        const markerImage =
          new kakao.maps.MarkerImage(

            `data:image/svg+xml;charset=utf-8,

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
            >

              <circle
                cx="21"
                cy="21"
                r="16"
                fill="${markerColor}"
                stroke="white"
                stroke-width="4"
              />

            </svg>`,

            new kakao.maps.Size(42, 42)

          );

        // 마커 생성
        const marker =
          new kakao.maps.Marker({

            map: map,
            position: position,
            image: markerImage

          });

        markers.push(marker);

        bounds.extend(position);

        // 커스텀 말풍선
        const overlayContent = `

          <div class="custom-overlay">

            <div class="overlay-title">
              ${place.place_name}
            </div>

            <div class="overlay-phone">
              📞 ${place.phone || "전화번호 없음"}
            </div>

            <div class="overlay-description">
              🌿 ${relaxDescription}
            </div>

            <a
              class="overlay-link"
              href="${place.place_url}"
              target="_blank"
            >
              카카오맵 보기
            </a>

          </div>

        `;

        const customOverlay =
          new kakao.maps.CustomOverlay({

            content: overlayContent,
            position: position,
            yAnchor: 1.4

          });

        overlays.push(customOverlay);

        // 마커 클릭
        kakao.maps.event.addListener(

          marker,

          "click",

          () => {

            closeAllOverlays();

            customOverlay.setMap(map);

          }

        );

        // 검색 결과 아이템
        const item =
          document.createElement("div");

        item.className = "place-item";

        item.innerHTML = `

          <div class="place-name">
            ${place.place_name}
          </div>

          <div class="place-address">
            ${place.road_address_name || place.address_name}
          </div>

          <div class="place-phone">
            ${place.phone || "전화번호 없음"}
          </div>

          <div class="place-description">
            🌿 ${relaxDescription}
          </div>

        `;

        // 리스트 클릭
        item.addEventListener("click", () => {

          map.setCenter(position);

          closeAllOverlays();

          customOverlay.setMap(map);

        });

        resultList.appendChild(item);

      });

      map.setBounds(bounds);

    }

    // 오버레이 닫기
    function closeAllOverlays() {

      overlays.forEach((overlay) => {
        overlay.setMap(null);
      });

    }

    // 마커 제거
    function removeMarkers() {

      markers.forEach((marker) => {
        marker.setMap(null);
      });

      overlays.forEach((overlay) => {
        overlay.setMap(null);
      });

      markers = [];
      overlays = [];

    }

  </script>

</body>
</html>
