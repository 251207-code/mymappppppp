<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        /* CSS: 화면을 예쁘게 꾸며주고 레이아웃을 잡는 역할 */
        body, html { 
            margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; 
        }
        
        /* 화면을 양옆으로 나누기 위해 Flexbox 사용 */
        #container { 
            display: flex; height: 100vh; 
        }
        
        /* 왼쪽 패널 (검색창 + 리스트) */
        #left-panel { 
            width: 300px; 
            padding: 15px; 
            box-sizing: border-box; 
            background-color: #f9f9f9; 
            overflow-y: auto; /* 내용이 길어지면 스크롤 생성 */
            border-right: 1px solid #ddd; 
        }
        
        /* 오른쪽 패널 (지도) */
        #right-panel { 
            flex: 1; /* 남은 공간을 모두 차지함 */
        }
        #map { 
            width: 100%; height: 100%; 
        }
        
        /* 검색창 디자인 */
        #search-box { 
            display: flex; gap: 5px; margin-bottom: 15px; 
        }
        #search-box input { 
            flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        #search-box button { 
            padding: 8px 12px; background-color: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        
        /* 검색 결과 리스트 디자인 */
        .places-list { list-style: none; padding: 0; margin: 0; }
        .item { padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; }
        .item:hover { background-color: #f0f0f0; } /* 마우스를 올렸을 때 색상 변화 */
        .item h5 { margin: 0 0 5px 0; font-size: 15px; color: #333; }
        .info { font-size: 12px; color: #666; display: block; margin-top: 3px; }
    </style>
</head>
<body>

    <div id="container">
        <div id="left-panel">
            <div id="search-box">
                <input type="text" id="keyword" placeholder="검색어 입력 (예: 맛집)" onkeypress="if(event.keyCode==13) { searchPlaces(); }">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>

        <div id="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d710afb68a9b941a190fa9f567d3977&libraries=services"></script>
    
    <script>
        // JS: 지도를 띄우고, 검색하고, 동작하게 만드는 역할

        // 1. 마커들을 관리할 배열
        let markers = [];

        // 2. 지도 생성하기
        const mapContainer = document.getElementById('map'); // 지도를 표시할 HTML 요소
        const mapOption = {
            center: new kakao.maps.LatLng(37.66, 126.83), // 페이지가 열릴 때 기본 중심좌표 (학교)
            level: 5 // 지도의 확대 레벨 (숫자가 작을수록 확대됨)
        };
        const map = new kakao.maps.Map(mapContainer, mapOption); // 지도 객체 생성

        // 장소 검색 객체와 마커 클릭 시 뜰 말풍선(인포윈도우) 객체 생성
        const ps = new kakao.maps.services.Places();
        const infowindow = new kakao.maps.InfoWindow({zIndex:1});

        // 3. 현재 위치 권한을 얻어와서 지도 중심 이동하기
        if (navigator.geolocation) {
            // 브라우저가 위치 정보를 지원한다면 현재 위치를 요청
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude; // 위도
                const lon = position.coords.longitude; // 경도
                
                const locPosition = new kakao.maps.LatLng(lat, lon); // 현재 위치 좌표
                map.setCenter(locPosition); // 지도 중심을 현재 위치로 부드럽게 이동
            });
        }

        // 4. 검색 버튼을 눌렀을 때 실행되는 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.trim()) {
                alert('검색어를 입력해주세요!');
                return;
            }
            // 카카오 API에 키워드 검색 요청
            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 5. 검색 결과를 받았을 때 처리하는 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data); // 검색 성공 시 화면에 표시
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 6. 검색된 장소들을 리스트와 지도 마커로 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); // 지도 범위를 재설정하기 위한 객체

            listEl.innerHTML = ''; // 이전 리스트 지우기
            removeMarker(); // 이전 마커 지우기

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = addMarker(placePosition); // 지도에 마커 찍기
                const itemEl = getListItem(places[i]);   // 리스트에 들어갈 HTML 만들기

                bounds.extend(placePosition); // 검색된 위치들을 모두 포함하도록 지도 범위 확장 준비

                // 마커나 리스트에 마우스를 올렸을 때 이름 표시
                (function(marker, title) {
                    kakao.maps.event.addListener(marker, 'mouseover', function() {
                        displayInfowindow(marker, title);
                    });
                    kakao.maps.event.addListener(marker, 'mouseout', function() {
                        infowindow.close();
                    });
                    itemEl.onmouseover = function () {
                        displayInfowindow(marker, title);
                    };
                    itemEl.onmouseout = function () {
                        infowindow.close();
                    };
                    
                    // 리스트 항목을 클릭하면 해당 장소로 지도 이동
                    itemEl.onclick = function() {
                        map.setCenter(placePosition);
                        map.setLevel(3); // 조금 더 확대해서 보여줌
                    };
                })(marker, places[i].place_name);

                listEl.appendChild(itemEl); // 완성된 리스트 항목을 화면에 추가
            }
            map.setBounds(bounds); // 모든 마커가 보이게 지도 범위 및 중심 이동
        }

        // 7. 검색 결과 리스트의 HTML 요소를 만드는 함수
        function getListItem(places) {
            const el = document.createElement('li');
            el.className = 'item';
            
            let itemStr = '<h5>' + places.place_name + '</h5>';
            itemStr += '<span class="info">' + (places.road_address_name || places.address_name) + '</span>';
            if(places.phone) {
                itemStr += '<span class="info">📞 ' + places.phone + '</span>';
            }
            el.innerHTML = itemStr;
            return el;
        }

        // 8. 마커를 생성하고 지도 위에 표시하는 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({ position: position });
            marker.setMap(map);
            markers.push(marker);
            return marker;
        }

        // 9. 지도 위의 모든 마커를 지우는 함수
        function removeMarker() {
            for (let i = 0; i < markers.length; i++ ) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 10. 말풍선(인포윈도우)을 표시하는 함수
        function displayInfowindow(marker, title) {
            const content = '<div style="padding:5px;z-index:1;font-size:12px;
